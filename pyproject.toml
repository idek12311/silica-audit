[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "silica-tools"
version = "1.0.0"
description = "Silica Python tool runners (Slither, Foundry, source-fetch, perimeter)"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "docker>=7.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "bandit>=1.7.7",
    "radon>=6.0.1",
    "mypy>=1.8.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "W", "F", "I", "UP", "B", "C90"]
ignore = ["E501"]

[tool.ruff.per-file-ignores]
"tools/*/tests/*" = ["S101", "B011"]

[tool.pytest.ini_options]
testpaths = ["tools", "bench"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--tb=short"
timeout = 60

[tool.bandit]
exclude_dirs = ["tests", "bench"]
skips = ["B101"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
