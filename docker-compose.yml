version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: silica-postgres
    environment:
      POSTGRES_DB: silica
      POSTGRES_USER: silica
      POSTGRES_PASSWORD: silica
    ports:
      - "5432:5432"
    volumes:
      - silica_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U silica"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: silica-redis
    command: redis-server --maxmemory-policy noeviction
    ports:
      - "6379:6379"
    volumes:
      - silica_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  silica_pg_data:
  silica_redis_data:
